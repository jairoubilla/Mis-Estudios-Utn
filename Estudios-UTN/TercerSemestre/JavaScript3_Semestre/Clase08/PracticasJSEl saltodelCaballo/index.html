<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Salto del Caballo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: white;
            color: black;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        p {
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
        }

        button {
            margin: 4px;
            padding: 6px 14px;
            font-size: 14px;
            cursor: pointer;
        }

        #estado {
            margin: 10px 0;
            font-size: 13px;
        }

        #tablero {
            display: inline-grid;
            grid-template-columns: repeat(8, 55px);
            border: 2px solid black;
            margin: 10px auto;
        }

        .casilla {
            width: 55px;
            height: 55px;
            border: 1px solid #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            background: white;
            position: relative;
        }

        .casilla.visitada {
            background: #ccc;
        }

        .casilla.actual {
            background: #888;
            color: white;
        }

        .casilla.origen {
            background: #444;
            color: white;
        }

        .casilla .coordenada {
            position: absolute;
            bottom: 2px;
            right: 3px;
            font-size: 8px;
            font-weight: normal;
            color: #999;
        }

        .casilla.actual .coordenada,
        .casilla.origen .coordenada {
            color: #ddd;
        }

        label {
            font-size: 13px;
        }
    </style>
</head>

<body>
    <h1>Salto del Caballo</h1>
    <p>
        Algoritmo de vuelta atras (Backtracking) — Tablero 8x8 — Posicion inicial:
        (0, 0)
    </p>

    <div>
        <button id="botonResolver" onclick="iniciarRecorrido()">Resolver</button>
        <button id="botonAnimar" onclick="alternarAnimacion()" disabled>
            Animar
        </button>
        <button onclick="reiniciarTablero()">Reiniciar</button>
    </div>

    <div style="margin-top: 8px">
        <label for="velocidad">Velocidad: </label>
        <input type="range" id="velocidad" min="30" max="600" value="200" step="10" oninput="
        document.getElementById('etiquetaVelocidad').textContent =
            this.value + 'ms'
        " />
        <span id="etiquetaVelocidad">200ms</span>
    </div>

    <div id="estado"></div>

    <div id="tablero"></div>

    <script src="caballo.js"></script>
</body>

</html>
