<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solución del Problema de las N-Reinas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        .controles {
            margin-bottom: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }
        label { font-weight: bold; color: #34495e; }
        input, select, button {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
            font-size: 14px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #27ae60; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        /* Contenedor dinámico del tablero visual */
        #contenedor-tablero {
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 4px solid #34495e;
            background-color: white;
            display: none;
        }
        
        .tablero {
            display: grid;
        }
        .celda {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: background-color 0.1s ease;
        }
        
        .celda.blanca { background-color: #f0d9b5; }
        .celda.negra { background-color: #b58863; }
        .celda.probando { background-color: #e74c3c !important; } 
        .celda.reina { animation: aparecer 0.2s ease-out; }
        
        /* Consola de Texto incrustada en el Navegador */
        #consola-salida {
            margin-top: 20px;
            width: 90%;
            max-width: 600px;
            height: 400px;
            background-color: #1e1e1e;
            color: #f1f1f1;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 6px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            overflow-y: auto;
            white-space: pre-wrap;
            display: none; 
        }
        
        #estado, #arreglo-indices {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
            text-align: center;
        }

        @keyframes aparecer {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>Problema de N-Reinas</h1>
    
    <div class="controles">
        <label for="select-metodo">Método:</label>
        <select id="select-metodo">
            <option value="consola">Modo Texto (Salida por Consola en Pantalla)</option>
            <option value="visual">Modo Visual (Tablero Animado)</option>
        </select>

        <label id="label-n" for="input-n">N:</label>
        <input type="number" id="input-n" value="8" min="8" max="16">
        
        <label id="label-vel" for="input-velocidad">Velocidad (ms):</label>
        <input type="number" id="input-velocidad" value="100" min="50" max="2000" step="50">
        
        <button id="btn-iniciar">Iniciar Búsqueda</button>
    </div>

    <div id="estado">Elige un método y haz clic en Iniciar.</div>
    
    <div id="contenedor-tablero"></div>
    <div id="consola-salida"></div>
    
    <div id="arreglo-indices"></div>

    <script src="N-Reinas-visual.js"></script>
    <script src="N-Reinas-consola.js"></script>
    
    <script>
        // Intercambio de vista según el método seleccionado
        const selectMetodo = document.getElementById("select-metodo");
        const inputVel = document.getElementById("input-velocidad");
        const labelVel = document.getElementById("label-vel");
        const contenedorTablero = document.getElementById("contenedor-tablero");
        const consolaSalida = document.getElementById("consola-salida");
        const txtIndices = document.getElementById("arreglo-indices");
        const txtEstado = document.getElementById("estado");

        function actualizarInterfaz() {
            if (selectMetodo.value === "visual") {
                inputVel.style.display = "inline-block";
                labelVel.style.display = "inline-block";
                contenedorTablero.style.display = "block";
                consolaSalida.style.display = "none";
                txtIndices.style.display = "block";
                txtEstado.innerText = "Configura los parámetros del tablero visual.";
            } else {
                inputVel.style.display = "inline-block";
                labelVel.style.display = "inline-block";
                contenedorTablero.style.display = "none";
                consolaSalida.style.display = "block";
                txtIndices.style.display = "none";
                consolaSalida.innerHTML = "=== LA TERMINAL ESTÁ LISTA ===";
                txtEstado.innerText = "El texto de las iteraciones se imprimirá abajo.";
            }
        }

        selectMetodo.addEventListener("change", actualizarInterfaz);
        window.addEventListener("DOMContentLoaded", actualizarInterfaz);

        document.getElementById("btn-iniciar").addEventListener("click", () => {
            const inputN = document.getElementById("input-n");
            const btn = document.getElementById("btn-iniciar");
            
            let n = parseInt(inputN.value, 10);
            let metodo = selectMetodo.value;

            // Verificamos que N sea igual o meyor que 8
            if (isNaN(n) || n < 8) {
                alert("❌ Por favor ingresa un número válido (Mínimo 8 para calcular soluciones).");
                return;
            }

            let velocidad = parseInt(inputVel.value, 10) || 50;

            // Deshabilitar controles globales
            btn.disabled = true;
            inputN.disabled = true;
            selectMetodo.disabled = true;

            if (metodo === "visual") {
                const simulacion = new NReinasVisual(n, velocidad);
                simulacion.resolver().then(() => {
                    btn.disabled = false;
                    inputN.disabled = false;
                    selectMetodo.disabled = false;
                });
            } 
            else {
                // Limpiamos la terminal en pantalla
                consolaSalida.innerHTML = "";
                
                // Instanciar y ejecutar el modo consola en pantalla
                const juegoConsola = new NReinasConsola(n, consolaSalida, velocidad);
                
                juegoConsola.resolver().then(() => {
                    btn.disabled = false;
                    inputN.disabled = false;
                    selectMetodo.disabled = false;
                });
            }
        });
    </script>
</body>
</html>
