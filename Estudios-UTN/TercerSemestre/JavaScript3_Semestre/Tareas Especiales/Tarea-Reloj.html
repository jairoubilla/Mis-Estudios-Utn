<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Digital con Modo Noche</title>
    <style>
        /* Colores para el Modo Día / por defecto */
        :root {
            --bg-body: #6a5acd;       /* Fondo purpura */
            --bg-clock: #1a1a2e;      /* Rectángulo oscuro */
            --text-glow: #00ff00;     /* Verde neón */
            --text-date: #ffffff;
            --shadow-color: rgba(0,0,0,0.5);
        }

        /* Colores para el Modo Noche (Colores más cálidos o apagados) */
        [data-theme="night"] {
            --bg-body: #121212;       /* Fondo casi negro */
            --bg-clock: #000000;      /* Negro puro */
            --text-glow: #ff4500;     /* Naranja rojizo */
            --text-date: #b0b0b0;
            --shadow-color: rgba(255, 69, 0, 0.2);
        }

        body {
            background-color: var(--bg-body);
            transition: background-color 0.5s ease; 
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Estilo del switch */
        .switch-container {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            color: white;
            gap: 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(26px); }

        /* Contenedor principal */
        .clock-container {
            background-color: var(--bg-clock);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 50px var(--shadow-color);
            text-align: center;
            min-width: 400px;
            transition: all 0.5s ease;
        }

        .time {
            color: var(--text-glow);
            font-size: 80px;
            font-weight: bold;
            margin: 0;
            text-shadow: 0 0 10px var(--text-glow), 
                        0 0 20px var(--text-glow);
            letter-spacing: 5px;
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .date {
            color: var(--text-date);
            font-size: 24px;
            margin-top: 20px;
            transition: color 0.5s ease;
        }

        .status {
            color: #a0a0a0;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="switch-container">
        <span>Modo Día</span>
        <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
        <span>Modo Noche</span>
    </div>

    <div class="clock-container">
        <div class="time" id="time">00:00:00</div>
        <div class="date" id="date">Cargando fecha...</div>
        <div class="status">Actualización en tiempo real</div>
    </div>

    <script>
        const toggle = document.getElementById('theme-toggle');
        
        // Verificamos si cambiaron la opcion de dia / noche
        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                document.documentElement.setAttribute('data-theme', 'night');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        });

        // Funcion que muestra el reloj
        function updateClock() {
            const now = new Date();

            // Obtenemos la hora, minutos y segundos
            let hora = now.getHours().toString().padStart(2, '0');
            let minutos = now.getMinutes().toString().padStart(2, '0');
            let segundos = now.getSeconds().toString().padStart(2, '0');

            // Formatear la hora y mostrar la hora
            document.getElementById('time').textContent = `${hora}:${minutos}:${segundos}`;

            // Formateamos la fecha con el formato largo (Lunes, 11 de Mayo de 2026)
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };

            let dateString = now.toLocaleDateString('es-ES', options);
            
            // Colocamos la primera letra del dia en mayuscula 
            dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
            
            // Eliminamos la coma que pone despues del nombre del día de la semana
            dateString = dateString.replace(',', '');
            
            // Mostramos el string de la fecha
            document.getElementById('date').textContent = dateString;
        }

        // Ejecutamos cada un segundo
        setInterval(updateClock, 1000);

        // Ejecutamos inmediatamente al cargar
        updateClock();
    </script>
</body>
</html>
